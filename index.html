<html lang="en">

<head>

<audio id="background-music" loop preload="metadata">

</audio>

<div class="vhs-overlay"></div>

  <div class = "buttons">

    </a>

      <button type="button">game</button>
    </a>
    <a href="https://youtu.be/5s_GHRQ5pkQ">

    </a>

<div class="character-container">

  <div class="character-shadow"></div>

  <div class = "character">
  <img class ="character_spritesheet pixelart face-forward" src = "./assets/images/run.webp" alt = "character"/>
  </div>
</div>

<script src="./js/home.js"></script>
