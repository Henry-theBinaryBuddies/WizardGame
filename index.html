<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tunnel Run II</title>

  <link rel="stylesheet" href="css/game.css">
</head>

<body>

<main id="game">
  <h1>Wizard Dungeon</h1>

  <canvas
    id="dungeon-view"
    width="640"
    height="480">
  </canvas>

  <pre id="debug-view"></pre>

  <div id="hud">
    <span id="health">HP: 3</span>
    <span id="keys">Artifacts: 0 / 3</span>
    <span id="potions">Potions: 0</span>
  </div>

  <div id="status">
    Explore the dungeon.
  </div>

  <div id="controls">
    <button id="turn-left">Turn Left</button>
    <button id="move-forward">Forward</button>
    <button id="turn-right">Turn Right</button>
    <button id="use-potion">Use Potion</button>
  </div>
</main>

<script type="module" src="js/game.js"></script>

</body>
</html>
