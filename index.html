<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tunnel Run II</title>

  <link rel="stylesheet" href="css/game.css">
</head>

<body>

<main id="game">
  <canvas
    id="dungeon-view"
    width="640"
    height="480">
  </canvas>

  <pre id="debug-view"></pre>

  <div id="hud">
    <div id="health-display"></div>
    <div id="potion-display">

      <img
        id="potion-hud-icon"
        src="assets/images/potion.png"
        alt="Potion"
      >

      <span id="potion-count">
    0
  </span>

    </div>
    <div id="artifact-display">
      <img
        id="artifact-hud-icon"
        src="assets/images/artifact.png"
        alt="Artifact"
      >

      <span id="artifact-count">
      0 / 3
    </span>
    </div>
  </div>

  <div id="controls">
    <button id="turn-left">Turn Left</button>
    <button id="move-forward">Forward</button>
    <button id="turn-right">Turn Right</button>
    <button id="use-potion">Use Potion</button>
  </div>
</main>

<div id="death-overlay">

  <div id="death-content">

    <div id="death-title">
      You Died
    </div>

    <button id="play-again-button">
      Play Again
    </button>

  </div>

</div>

<div id="win-overlay">

  <div id="win-content">

    <div id="win-title">
      Victory
    </div>

    <div id="win-subtitle">
      You Escaped Tunnel Run
    </div>

    <button id="win-play-again-button">
      Play Again
    </button>

  </div>

</div>

<script type="module" src="js/game.js"></script>

</body>
</html>
